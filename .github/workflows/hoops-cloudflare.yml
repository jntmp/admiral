name: Pixel Hoops on Cloudflare

# Builds the game in hoops/ and serves it from Cloudflare Workers as static
# assets (hoops/wrangler.jsonc). Pushes to master deploy production; pushes to
# any other branch create or update that branch's Preview, which keeps the
# same URL from commit to commit.
#
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
# Without them the build and tests still run and the deploy is skipped.
on:
  push:
    paths:
      - 'hoops/**'
      - '.github/workflows/hoops-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoops-cloudflare-${{ github.ref }}
  # Queue rather than cancel, so a deploy is never cut off halfway.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'cloudflare' || 'cloudflare-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Worker Previews need 4.135.0 or later.
      WRANGLER: wrangler@4.151.0
    defaults:
      run:
        working-directory: hoops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoops/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Skip the deploy without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: >
          echo "::notice::Built and tested, not deployed. Add the CLOUDFLARE_API_TOKEN and
          CLOUDFLARE_ACCOUNT_ID repository secrets to deploy to Cloudflare."

      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            npx --yes "$WRANGLER" deploy --message "${GITHUB_SHA::7}" | tee deploy.log
            url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
            title="Production"
          else
            # The Preview name becomes part of a hostname: lowercase letters,
            # digits and hyphens only.
            name=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
            npx --yes "$WRANGLER" preview --name "$name" --message "${GITHUB_SHA::7}" --json | tee preview.json
            # The stable Preview URL starts with the Preview's name; the other
            # one is unique to this deployment.
            url=$(grep -oE "https://${name}-[a-z0-9.-]+\.workers\.dev" preview.json | head -1)
            [ -n "$url" ] || url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' preview.json | head -1)
            title="Preview of \`$GITHUB_REF_NAME\`"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### $title: $url" >> "$GITHUB_STEP_SUMMARY"
