name: Pixel Hoops

# Builds the game in hoops/ and publishes it to GitHub Pages. Pull requests
# get the build and tests only; pushes to master also deploy.
on:
  push:
    branches: [master]
    paths:
      - 'hoops/**'
      - '.github/workflows/hoops-pages.yml'
  pull_request:
    paths:
      - 'hoops/**'
      - '.github/workflows/hoops-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoops-${{ github.ref }}
  # Supersede stale PR builds, but never cut a Pages deployment off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hoops/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: hoops/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
